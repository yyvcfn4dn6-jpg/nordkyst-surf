<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nordkyst">
<title>Nordkyst Surf – North Zealand windswell forecast</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--navy:#0b1f33;--navy2:#13304d;--accent:#2a78d6;--bg:#eef1f4;--card:#fff;--line:#e2e5e9;--ink:#0b0b0b;--ink2:#55606b;--ink3:#8a949e;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:750;letter-spacing:.3px;font-size:17px}
.brand svg{width:26px;height:26px}
.status{margin-left:auto;font-size:12px;color:#a9c3de;text-align:right}
.status.warn{color:#ffd27a}.status.err{color:#ff9a9a}
#refresh{background:none;border:0;color:#fff;font-size:20px;padding:4px 6px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:12px 12px calc(84px + var(--safe-b))}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + var(--safe-b))}
.tabbar a{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--ink3);gap:2px;min-width:72px}
.tabbar a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.tabbar a.on{color:var(--accent)}
.muted{color:var(--ink2)}.small{font-size:12.5px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 2px rgba(11,31,51,.06)}
.card h3{margin:0 0 6px;font-size:15px}.card p{margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.2px;text-transform:uppercase;padding:2px 8px 2px 6px;border-radius:99px;background:#f3f5f7;color:var(--ink);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.arr{fill:currentColor;vertical-align:-2px;display:inline-block}
/* hero */
.hero{display:block;background:linear-gradient(160deg,#0b1f33 0%,#13406b 70%,#1d5d94 100%);color:#fff;border-radius:16px;padding:16px;margin:4px 0 14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;bottom:-40px;width:200px;height:120px;border-radius:50%;border:18px solid rgba(255,255,255,.05)}
.hero.quiet{background:linear-gradient(160deg,#22313f,#3b4b5a)}
.hero-k{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:#9fc3ea;font-weight:700}
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;margin-top:4px}
.hero-spot{font-size:24px;font-weight:800;line-height:1.15}
.hero-when{color:#d6e6f7;font-size:14px}
.hero-p{text-align:right}.hero-p b{font-size:30px;display:block;line-height:1}.hero-p span{font-size:11px;color:#9fc3ea}
.hero-surf{display:flex;align-items:center;gap:14px;margin:10px 0 6px}
.big{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.5px}.big small{font-size:16px;font-weight:600;margin-left:2px}
.hero .chip{background:rgba(255,255,255,.14);color:#fff;margin-top:4px}
.hero-meta{font-size:13px;color:#d6e6f7}.hero-meta .arr{fill:#fff}
.hero-drive{margin-top:8px;font-size:13px;background:rgba(255,255,255,.1);display:inline-block;padding:4px 10px;border-radius:99px}
/* list */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 6px}.sec-h h2{font-size:17px;margin:0}
.list{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(11,31,51,.06)}
.row{display:flex;align-items:stretch;border-bottom:1px solid var(--line);min-height:84px}
.row:last-child{border-bottom:0}.row:active{background:#f6f8fa}
.stripe{width:6px;flex:none}
.row-main{flex:1;padding:10px 12px;min-width:0}
.row-top{display:flex;justify-content:space-between;gap:8px}.row-top b{font-size:15.5px}
.row-now{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}
.surf{font-weight:750;font-size:15px}.wind{font-size:12.5px;color:var(--ink2)}
.strip{display:flex;gap:3px;margin-top:7px}
.seg{flex:1;display:flex;flex-direction:column;gap:2px;max-width:60px}.seg i{height:6px;border-radius:3px}.seg em{font-style:normal;font-size:10px;color:var(--ink3)}
.row-next{width:78px;flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding-right:12px;text-align:right}
.row-next b{font-size:18px;color:var(--navy2)}.row-next span{font-size:11.5px;color:var(--ink2)}
.legend-r{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink2);margin:8px 2px}.legend-r i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.wins{display:grid;gap:8px}.win{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;background:#fff;border-radius:12px;padding:10px 12px;align-items:center}
.win span{grid-column:1;font-size:12.5px;color:var(--ink2)}.win .chip{grid-column:2;grid-row:1/3}.win em{grid-column:3;grid-row:1/3;font-style:normal;font-weight:800;color:var(--navy2)}
/* spot */
.sp-head{display:flex;gap:10px;align-items:center;margin:2px 0 8px}.sp-head h1{margin:0;font-size:22px}
.back{font-size:32px;line-height:1;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;color:var(--navy)}
.now-card{background:linear-gradient(160deg,#0b1f33,#13406b);color:#fff;border-radius:16px;padding:14px}
.now-card .muted{color:#a9c3de}
.now-top{display:flex;justify-content:space-between;gap:10px}
.now-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px}.now-card .chip{background:rgba(255,255,255,.14);color:#fff}
.pct b{font-size:26px;display:block;line-height:1}.pct span{font-size:11px;color:#a9c3de}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.stats div{background:rgba(255,255,255,.08);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;min-width:0}
.stats span{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#a9c3de}.stats b{font-size:15px;white-space:nowrap}.stats em{font-style:normal;font-size:11px;color:#cfe0f2}
.stats .arr{fill:#fff}
.note{margin-top:10px;font-size:12.5px;background:rgba(255,210,122,.16);border-left:3px solid #ffd27a;padding:6px 8px;border-radius:6px}
.dtabs{display:flex;gap:6px;overflow-x:auto;margin:12px -12px 0;padding:0 12px 2px;scrollbar-width:none}
.dtab{flex:none;border:0;background:#fff;border-radius:12px;padding:7px 10px 0;min-width:74px;display:flex;flex-direction:column;align-items:flex-start;font:inherit;cursor:pointer;overflow:hidden}
.dtab span{font-size:11.5px;color:var(--ink2)}.dtab b{font-size:14px}.dtab i{display:block;height:4px;width:calc(100% + 20px);margin:6px -10px 0}
.dtab.on{outline:2px solid var(--navy)}.dtab.past{opacity:.55}
.ch-h{display:flex;justify-content:space-between;align-items:center}.tog{font-size:12px;color:var(--ink2)}
svg .grid{stroke:#e8ebee}svg .ax{font-size:10.5px;fill:#6b7681}svg .ax.b{font-weight:700;fill:#0b1f33}
.tbl-wrap{overflow-x:auto;margin:6px -14px 0}
table.hours{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
table.hours th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);text-align:left;padding:6px 8px;font-weight:600}
table.hours td{padding:8px;border-top:1px solid var(--line);white-space:nowrap}
table.hours tr{cursor:pointer}table.hours tr.sel td{background:#eef5ff}table.hours tr.past td{color:var(--ink3)}
table.hours small{color:var(--ink3)}
.mc{width:100%;border-collapse:collapse;font-size:13px}.mc td,.mc th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}.mc th{font-size:11px;color:var(--ink3);font-weight:600}
.kv{display:grid;grid-template-columns:86px 1fr;gap:5px 10px;font-size:13.5px;margin:8px 0 0}.kv dt{color:var(--ink2)}.kv dd{margin:0}.kv a{color:var(--accent)}
.rose{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.rose svg{max-width:100%}.rose .small{flex:1;min-width:160px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--navy)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.block{display:flex;width:100%;margin:12px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.link{background:none;border:0;font:inherit;font-size:12px;color:var(--ink3);padding:0;cursor:pointer}.link.danger{color:#c0392b}
.page-h h1{margin:6px 2px 0;font-size:22px}.page-h p{margin:2px 2px 0}
.form label{display:flex;flex-direction:column;font-size:12.5px;color:var(--ink2);gap:4px;margin:8px 0}
.form input,.form select,.form textarea{font:inherit;font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;width:100%}
.two{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
fieldset{border:0;padding:0;margin:10px 0}legend{font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opt input{position:absolute;opacity:0}
.opt span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13.5px;cursor:pointer;background:#fff}
.opt span[style]::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.opt input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy)}
.opt input:focus-visible+span{outline:2px solid var(--accent)}
.sess{display:grid;gap:8px}.sitem{background:#fff;border-radius:12px;padding:10px 12px;display:grid;gap:4px;font-size:13.5px}
.card .sitem{padding:8px 0;border-bottom:1px solid var(--line);border-radius:0}
.tip{position:fixed;z-index:50;pointer-events:none;background:#0b1f33;color:#fff;font-size:12px;border-radius:8px;padding:7px 9px;display:none;max-width:230px;line-height:1.45}
.tip .chip{background:rgba(255,255,255,.14);color:#fff}
.skeleton{padding:40px 10px;text-align:center;color:var(--ink2)}
@media(min-width:900px){main{max-width:820px}.tabbar{justify-content:center;gap:40px}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#2a78d6"/><path d="M5 19c3-6 7-8 11-6 2 1 3 3 2 5-1 1.5-3 1.5-4 .5 3 0 3-4-1-4-4 0-6 3-8 4.5z" fill="#fff"/><path d="M5 23c4 0 6-2 11-2s7 2 11 2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    Nordkyst
  </a>
  <div class="status" id="status"></div>
  <button id="refresh" aria-label="Refresh">⟳</button>
</header>
<main id="view"><div class="skeleton">Loading DMI wind over the Kattegat…</div></main>
<nav class="tabbar">
  <a href="#home" data-r="home"><svg viewBox="0 0 24 24"><path d="M2 15c3-5 6-7 10-5 2 1 3 3 2 5M2 19c4 0 6-2 10-2s6 2 10 2"/></svg>Forecast</a>
  <a href="#log" data-r="log"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/><circle cx="12" cy="12" r="10"/></svg>Log session</a>
  <a href="#model" data-r="model"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Model</a>
</nav>
<div class="tip" id="tip"></div>
<script src="js/kwm.js"></script>
<script src="js/app.js"></script>
</body>
</html>
